# ESP Screens - the looks' own faces, for every look that has room for them (looks/standard.yaml includes this file).
#
# The Theme setting (settings_screen::theme, its entities in packages/core.yaml) draws the cards in one of four looks:
# Classic, Glow, Vision and Soft. Three bring faces of their own: Glow's icon without a circle, as large as that circle
# was; Vision's tile name in Roboto's medium face; Soft's Figtree (fonts/Figtree-*.ttf, OFL) for the name, the state and
# a big value, and its outline icons (tools/soft_outlines.py writes their glyphs). They cost some hundreds of KB: the
# compact look (a board with 4 MB of flash) leaves this file out, and its looks keep the card's own faces
# (runtime_tiles falls back wherever a face is missing).
substitutions:
  # Handed to the cards at boot (packages/core.yaml, on_boot), before the first card is drawn.
  BOOT_THEMES: |-
    runtime_tiles::glow_icon_face = id(materialdesign_icons_glow)->get_lv_font();
    runtime_tiles::vision_name_face = id(vision_label)->get_lv_font();
    runtime_tiles::soft_name_s = id(soft_name_s)->get_lv_font();
    runtime_tiles::soft_name_m = id(soft_name_m)->get_lv_font();
    runtime_tiles::soft_name_l = id(soft_name_l)->get_lv_font();
    runtime_tiles::soft_state_s = id(soft_state_s)->get_lv_font();
    runtime_tiles::soft_state_m = id(soft_state_m)->get_lv_font();
    runtime_tiles::soft_state_l = id(soft_state_l)->get_lv_font();
    runtime_tiles::soft_value_s = id(soft_value_s)->get_lv_font();
    runtime_tiles::soft_value_m = id(soft_value_m)->get_lv_font();
    runtime_tiles::soft_value_l = id(soft_value_l)->get_lv_font();
    runtime_tiles::soft_value_xl = id(soft_value_xl)->get_lv_font();
    runtime_tiles::soft_value_hero = id(soft_value_hero)->get_lv_font();
    runtime_tiles::soft_outline_s = id(soft_outline_icons_mini)->get_lv_font();
    runtime_tiles::soft_outline_m = id(soft_outline_icons)->get_lv_font();
    runtime_tiles::soft_outline_l = id(soft_outline_icons_big)->get_lv_font();

